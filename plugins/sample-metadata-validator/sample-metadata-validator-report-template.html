<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sample Metadata Validation Report</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         margin: 0; padding: 20px; background: #ffffff; color: #1f2937; }
  .header { border-bottom: 2px solid #e5e7eb; padding-bottom: 12px; margin-bottom: 16px; }
  .header h1 { font-size: 20px; margin: 0; }
  .header .meta { font-size: 12px; color: #6b7280; margin-top: 4px; }
  .status-badge { display: inline-block; padding: 4px 12px; border-radius: 4px;
                  font-weight: bold; color: white; }
  .status-valid { background: #16a34a; }
  .status-warning { background: #f59e0b; }
  .status-blocked { background: #dc2626; }
  .check-item { padding: 8px 12px; border-left: 3px solid #e5e7eb; margin-bottom: 4px; background: #f9fafb; }
  .check-passed { border-color: #16a34a; }
  .check-error { border-color: #dc2626; }
  .check-warning { border-color: #f59e0b; }
  .summary-box { margin: 12px 0; padding: 12px; border-radius: 6px; }
  .summary-ok { background: #f0fdf4; }
  .summary-warn { background: #fef3c7; }
  .summary-blocked { background: #fef2f2; }
  table { border-collapse: collapse; width: 100%; }
  td { padding: 4px; }
  td.label { font-weight: bold; }
</style>
</head>
<body>
<div class="header">
  <h1>Sample Metadata Validation Report</h1>
  <div class="meta">
    Plugin: sample-metadata-validator v1.0.0 |
    <span class="status-badge status-valid">✓ VALID</span>
  </div>
</div>
<p>This report is generated by the R script. The actual content is produced at runtime.</p>
</body>
</html>
